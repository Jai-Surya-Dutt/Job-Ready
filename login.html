<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JobReady</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
        <div class="logo">
            <i class="fas fa-briefcase"></i>
            <span>JobReady</span>
        </div>
        <div class="nav-links">
            <a href="index.html"><i class="fas fa-home"></i> Home</a>
            <a href="resume.html"><i class="fas fa-file-alt"></i> Resume</a>
            <a href="interview.html"><i class="fas fa-video"></i> Interview</a>
            <a href="about.html"><i class="fas fa-info-circle"></i> About</a>
            <a href="login.html" class="active"><i class="fas fa-user"></i> Login</a>
        </div>
    </nav>

    <!-- Login Section -->
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-box">
                <!-- Login Form -->
                <div class="login-section" id="loginSection">
                    <h2><i class="fas fa-user-circle"></i> Welcome Back</h2>
                    <p class="auth-subtitle">Sign in to continue to JobReady</p>
                    
                    <form class="auth-form">
                        <div class="form-group">
                            <label for="email"><i class="fas fa-envelope"></i> Email</label>
                            <input type="email" id="email" required>
                        </div>
                        <div class="form-group">
                            <label for="password"><i class="fas fa-lock"></i> Password</label>
                            <input type="password" id="password" required>
                        </div>
                        <div class="form-options">
                            <label class="remember-me">
                                <input type="checkbox"> Remember me
                            </label>
                            <a href="#" class="forgot-password">Forgot Password?</a>
                        </div>
                        <button type="submit" class="auth-submit-btn">Sign In</button>
                    </form>

                    <div class="auth-divider">
                        <span>or continue with</span>
                    </div>

                    <div class="social-auth">
                        <button class="google-btn">
                            <i class="fab fa-google"></i> Google
                        </button>
                        <button class="linkedin-btn">
                            <i class="fab fa-linkedin"></i> LinkedIn
                        </button>
                    </div>

                    <div class="auth-switch">
                        Don't have an account? <a href="#" onclick="toggleAuth()">Sign Up</a>
                    </div>
                </div>

                <!-- Sign Up Form -->
                <div class="signup-section" id="signupSection" style="display: none;">
                    <h2><i class="fas fa-user-plus"></i> Create Account</h2>
                    <p class="auth-subtitle">Join JobReady to start your journey</p>
                    
                    <form class="auth-form">
                        <div class="form-group">
                            <label for="fullName"><i class="fas fa-user"></i> Full Name</label>
                            <input type="text" id="fullName" required>
                        </div>
                        <div class="form-group">
                            <label for="signupEmail"><i class="fas fa-envelope"></i> Email</label>
                            <input type="email" id="signupEmail" required>
                        </div>
                        <div class="form-group">
                            <label for="signupPassword"><i class="fas fa-lock"></i> Password</label>
                            <input type="password" id="signupPassword" required>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword"><i class="fas fa-lock"></i> Confirm Password</label>
                            <input type="password" id="confirmPassword" required>
                        </div>
                        <button type="submit" class="auth-submit-btn">Create Account</button>
                    </form>

                    <div class="auth-divider">
                        <span>or sign up with</span>
                    </div>

                    <div class="social-auth">
                        <button class="google-btn">
                            <i class="fab fa-google"></i> Google
                        </button>
                        <button class="linkedin-btn">
                            <i class="fab fa-linkedin"></i> LinkedIn
                        </button>
                    </div>

                    <div class="auth-switch">
                        Already have an account? <a href="#" onclick="toggleAuth()">Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleAuth() {
            const loginSection = document.getElementById('loginSection');
            const signupSection = document.getElementById('signupSection');
            
            if (loginSection.style.display === 'none') {
                loginSection.style.display = 'block';
                signupSection.style.display = 'none';
            } else {
                loginSection.style.display = 'none';
                signupSection.style.display = 'block';
            }
        }
    </script>
</body>
</html>
